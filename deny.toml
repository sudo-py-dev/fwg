# cargo-deny: licence, advisory and source checks for every dependency.

[graph]
all-features = true

[advisories]
# Fail on known vulnerabilities, and on unmaintained or yanked crates.
yanked = "deny"
unmaintained = "workspace"

[licenses]
# Every licence must be on this list (for dual-licensed crates, one is enough).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
