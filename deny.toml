# cargo-deny: licence, advisory and source checks for every dependency.

[graph]
all-features = true

[advisories]
# Fail on known vulnerabilities, and on unmaintained or yanked crates.
yanked = "deny"
unmaintained = "workspace"

[licenses]
# Every licence must be on this list (for dual-licensed crates, one is enough).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

# cfg_block (used by turso_core) ships only an Apache-2.0 notice as LICENSE, which is
# too short to detect. Pinned to the file's hash: a changed licence fails the check.
[[licenses.clarify]]
crate = "cfg_block"
expression = "Apache-2.0"
license-files = [{ path = "LICENSE", hash = 0x0fb72a18 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
