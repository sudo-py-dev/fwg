[workspace]
resolver = "3"
members = ["crates/fwg-core", "crates/fwg-nft", "fwg"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
fwg-core = { path = "crates/fwg-core" }
fwg-nft = { path = "crates/fwg-nft" }
anyhow = "1.0.104"
thiserror = "2.0.21"
clap = { version = "4.6.8", features = ["derive"] }
ipnet = { version = "2.12.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
tempfile = "3.27.0"
insta = { version = "1.49.0", features = ["json"] }
proptest = "1.12.0"
assert_cmd = "2.2.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "warn"
undocumented_unsafe_blocks = "deny"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
