[workspace]
resolver = "3"
members = ["crates/fwg-core", "crates/fwg-import", "crates/fwg-ipc", "crates/fwg-nft", "crates/fwg-store", "crates/fwg-watch", "fwg", "fwgd"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
fwg-core = { path = "crates/fwg-core", version = "0.1.0-alpha.1" }
fwg-import = { path = "crates/fwg-import", version = "0.1.0-alpha.1" }
fwg-ipc = { path = "crates/fwg-ipc", version = "0.1.0-alpha.1" }
fwg-nft = { path = "crates/fwg-nft", version = "0.1.0-alpha.1" }
fwg-store = { path = "crates/fwg-store", version = "0.1.0-alpha.1" }
fwg-watch = { path = "crates/fwg-watch", version = "0.1.0-alpha.1" }
anyhow = "1.0.104"
thiserror = "2.0.21"
clap = { version = "4.6.8", features = ["derive", "env"] }
ipnet = { version = "2.12.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
tempfile = "3.27.0"
insta = { version = "1.49.0", features = ["json"] }
proptest = "1.12.0"
regex = "1.13.2"
# Pinned on purpose: pre-1.0, upgraded only with the crash test passing (see STACK_NOTES §5).
turso = { version = "=0.8.3", default-features = false }
tokio = "1.54.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
assert_cmd = "2.2.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "warn"
undocumented_unsafe_blocks = "deny"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
